name: Database backup

on:
  # Nightly schedule disabled — it emailed "All jobs have failed" because
  # GitHub secrets were never set. Run manually from Actions when needed.
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      - uses: actions/upload-artifact@v4
        with:
          name: glai-backup
          path: backups/
          retention-days: 30
